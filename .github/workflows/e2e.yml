# E2E test suite on every PR and push to main.
#
# Runs the full Playwright suite against `astro dev` with a seeded local
# D1 (the same dev sandbox the suite uses locally). Failing PRs are
# blocked once the `e2e / playwright` check is made required on `main`
# (a one-off branch-protection step — see this ticket's resolution notes).
#
# Runner choice (#70 fog, resolved): ubuntu-latest. It's free for public
# repos, D1 seeding is milliseconds, and there's no self-hosted runner.
# Switch to self-hosted only if seeding/build proves slow on GH-hosted.
#
# Related: the visual baselines from #69 are generated by
# `toHaveScreenshot()` on first run; until they're committed (follow-up
# to #69) the visual tests pass without providing regression cover.

name: e2e

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs for the same ref when a new push lands.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build verifies type/integrity (the suite itself runs against the
      # dev server, not this build). astro build needs headroom on cold
      # runners, so lift the V8 heap.
      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Install Playwright browser (with system deps)
        run: pnpm exec playwright install --with-deps chromium

      # Seed the LOCAL dev D1 (miniflare SQLite), not the remote.
      # The script self-bootstraps: creates .wrangler/state/... if missing,
      # applies all migrations, and seeds the conv-test-001 test data.
      # astro dev reuses this SQLite file when Playwright starts it.
      - name: Seed local D1
        run: pnpm db:seed:dev

      # Create .dev.vars for Astro/Wrangler local dev environment in CI
      - name: Create .dev.vars for CI
        run: |
          cp .dev.vars.example .dev.vars
          sed -i 's/your-better-auth-secret-here/test-secret-12345678901234567890123456789012/' .dev.vars
          sed -i 's/your_md5_secret_here/test-webhook-secret-12345/' .dev.vars

      # webServer (playwright.config.ts) starts `astro dev`. The dev
      # command differs between local (pnpm not on PATH) and CI, so the
      # config reads E2E_DEV_COMMAND with a local-only default.
      - name: Run Playwright suite
        run: pnpm exec playwright test
        env:
          CI: "true"
          E2E_DEV_COMMAND: "pnpm dev"
          BETTER_AUTH_SECRET: "test-secret-12345678901234567890123456789012"
          CHILLPAY_MD5_SECRET: "test-webhook-secret-12345"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
